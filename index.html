<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>MASUI Kentaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn+SC:wght@400;600;700&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<style type="text/css">
body {
	font-family: "Vollkorn", serif;
	font-weight: 400;
	font-style: normal;
	letter-spacing: 2px;
	color: #001e43;
	background-color: #edf1f4;
	padding: 18px 24px;
}
h1 {
	font-weight: normal;
	font-size: 36px;
	margin: 0;  
	display: inline-block;
	line-height: 1em;
}
ul {
	font-size: 30px; 
	list-style-type: none;
	padding-left: 0;
}
li a {
	display: inline-block;
}
li:before {
	content: "- ";
}
@media (max-width:768px){
	h1 {
		font-size: 24px;
	}
	ul {
		font-size: 20px;
	}
}
a {
	color: #001e42;
}
h1 {
	animation: reveal 0.8s ease forwards;
}
li {
	
}
li:nth-child(1) {
	animation-delay: 0.2s;
}
li:nth-child(2) {
	animation-delay: 0.4s;
}
li:nth-child(3) {
	animation-delay: 0.7s;
}
li:nth-child(4) {
	animation-delay: 1s;
}
h1{
	clip-path: inset(0 100% 0 0);
	visibility: hidden;
	animation: reveal 0.8s ease forwards;
}
li {
	clip-path: inset(0 100% 0 0);
	visibility: hidden;
	animation: reveal 2.4s ease forwards;
}
@keyframes reveal {
	0% {
		clip-path: inset(0 100% 0 0);
		visibility: visible;
	}
	100% {
		clip-path: inset(0 0 0 0);
		visibility: visible;
	}
}
</style>
