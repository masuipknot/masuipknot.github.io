<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>MASUI Kentaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn+SC:wght@400;600;700&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<style type="text/css">
@keyframes reveal {
	0% {
		clip-path: inset(0 100% 0 0);
		visibility: visible;
	}
	100% {
		clip-path: inset(0 0 0 0);
		visibility: visible;
	}
}
html{
	min-height: 100vh;
	margin: 0;
}
body {
	opacity: 0;
	transition: opacity 0.3s ease;
	font-family: "Vollkorn", serif;
	font-weight: 400;
	font-style: normal;
	letter-spacing: 2px;
	color: #001e43;
	background-color: #edf1f4;
	padding: 18px 24px;
	/*
	background-image: url("img/background.jpg");
	background-size: cover;
    background-position:center center;
    background-repeat: no-repeat;
	*/
}
body.loaded {
	opacity: 1;
}
h1 {
	font-weight: normal;
	font-size: 36px;
	margin: 0;  
	display: inline-block;
	line-height: 1em;
}
ul {
	font-size: 30px; 
	list-style-type: none;
	padding-left: 0;
}
li a {
	display: inline-block;
}
li a:before {
	content: "- ";
}
@media (max-width:768px){
	h1 {
		font-size: 24px;
	}
	ul {
		font-size: 20px;
	}
}
a {
	color: #001e42;
}
h1 {
	animation: reveal 0.8s ease forwards;
}
li:nth-child(1) a { animation-delay: 0.2s; }
li:nth-child(2) a { animation-delay: 0.4s; }
li:nth-child(3) a { animation-delay: 0.55s; }
li:nth-child(4) a { animation-delay: 0.63s; }
li:nth-child(5) a { animation-delay: 0.80s; }
h1{
	clip-path: inset(0 100% 0 0);
	visibility: hidden;
	animation: reveal 0.8s ease forwards;
	background-color: #fff;
}
li a {
	clip-path: inset(0 100% 0 0);
	visibility: hidden;
	animation: reveal 0.8s ease forwards;
	background-color: #fff;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
	const img = new Image();
	img.onload = () => {
		document.body.style.backgroundImage = 'url("img/background.jpg")';
		document.body.style.backgroundSize = 'cover';
		document.body.style.backgroundPosition = 'center center';
		document.body.style.backgroundRepeat = 'no-repeat';
		document.body.classList.add('loaded');
	};
	img.src = 'img/background.jpg';
});
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-22737929-1"></script>
